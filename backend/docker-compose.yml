version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arec_postgres
    environment:
      POSTGRES_USER: arec_user
      POSTGRES_PASSWORD: arec_password
      POSTGRES_DB: arec_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arec_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arec_user -d arec_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: arec_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@arec.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - arec_network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  arec_network:
    driver: bridge
